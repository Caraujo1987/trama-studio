<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Trama — Pasarela AR</title><style>body{margin:0;background:#191b28;font:15px 'Segoe UI',sans-serif;color:white}.overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#191b28;padding:25px}.panel{max-width:430px}h1{font:36px Georgia}p{line-height:1.7;color:#bbb5c4}button,a{display:inline-block;border:0;border-radius:8px;background:#a93167;color:white;padding:14px 20px;margin:8px 8px 8px 0;font:inherit;cursor:pointer;text-decoration:none}button:disabled{opacity:.5}#status{position:fixed;bottom:25px;left:15px;right:15px;z-index:20;background:#191b28dd;padding:12px;border-radius:8px;font-size:12px;text-align:center;pointer-events:none}#exit{position:fixed;top:15px;left:15px;z-index:25}#arRoot{position:fixed;inset:0}</style></head><body><a id="exit" href="index.html">← Salir</a><div class="overlay" id="start"><div class="panel"><h1>Tu pasarela, aquí.</h1><p>Apunta al marcador Hiro impreso o abierto en otra pantalla. Verás tu video sobre la tarjeta. No es un modelo 3D.</p><button id="activate">Activar cámara</button><p id="error" role="status"></p></div></div><div id="arRoot"></div><div id="status">La cámara se activa solo cuando tú lo indiques.</div><script>'use strict';
let mediaURL,scene,clip;
function script(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(Error('No se pudo cargar el visor. Revisa tu conexión e intenta de nuevo.'));document.head.append(s)})}
async function videoFile(){const db=await new Promise((resolve,reject)=>{const r=indexedDB.open('trama-studio',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});return new Promise((resolve,reject)=>{const r=db.transaction('files').objectStore('files').get('video');r.onsuccess=()=>{db.close();resolve(r.result)};r.onerror=()=>reject(r.error)})}
document.querySelector('#activate').onclick=async()=>{const button=document.querySelector('#activate');button.disabled=true;try{if(!window.isSecureContext)throw Error('Abre la web mediante HTTPS para usar la cámara.');const blob=await videoFile();if(!blob)throw Error('Primero carga un video en Pasarela AR, desde este dispositivo.');mediaURL=URL.createObjectURL(blob);clip=document.createElement('video');clip.id='runwayClip';clip.src=mediaURL;clip.loop=true;clip.muted=true;clip.playsInline=true;clip.setAttribute('playsinline','');clip.setAttribute('webkit-playsinline','');clip.hidden=true;document.body.append(clip);await clip.play();clip.pause();await script('https://aframe.io/releases/1.6.0/aframe.min.js');await script('https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js');scene=document.createElement('a-scene');scene.setAttribute('embedded','');scene.setAttribute('vr-mode-ui','enabled: false');scene.setAttribute('renderer','antialias: true; alpha: true');scene.setAttribute('arjs','sourceType: webcam; debugUIEnabled: false;');const marker=document.createElement('a-marker');marker.setAttribute('preset','hiro');const plane=document.createElement('a-video');plane.setAttribute('src','#runwayClip');plane.setAttribute('rotation','-90 0 0');plane.setAttribute('position','0 0.02 0');const aspect=(clip.videoWidth||9)/(clip.videoHeight||16);plane.setAttribute('width',String(1.8*aspect));plane.setAttribute('height','1.8');marker.append(plane);const camera=document.createElement('a-entity');camera.setAttribute('camera','');scene.append(marker,camera);marker.addEventListener('markerFound',()=>{clip.play().catch(()=>{document.querySelector('#status').textContent='Toca la pantalla para reproducir el video.'});document.querySelector('#status').textContent='Marcador detectado · reproduciendo tu video'});marker.addEventListener('markerLost',()=>{clip.pause();document.querySelector('#status').textContent='Busca el marcador Hiro con la cámara.'});window.addEventListener('camera-error',()=>{document.querySelector('#status').textContent='No se pudo abrir la cámara. Revisa sus permisos en el navegador.'});document.querySelector('#arRoot').append(scene);document.querySelector('#start').style.display='none';document.querySelector('#status').textContent='Apunta al marcador Hiro. Permite el acceso a la cámara.';document.body.addEventListener('click',()=>{if(marker.object3D?.visible)clip.play().catch(()=>{})})}catch(error){if(clip)clip.remove();if(mediaURL)URL.revokeObjectURL(mediaURL);document.querySelector('#error').textContent=error.message;button.disabled=false}};
window.addEventListener('pagehide',()=>{clip?.pause();document.querySelectorAll('video').forEach(v=>v.srcObject?.getTracks().forEach(t=>t.stop()));if(mediaURL)URL.revokeObjectURL(mediaURL)});
</script></body></html>
